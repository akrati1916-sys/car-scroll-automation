<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scroll Driven Hero</title>

  <link rel="stylesheet" href="style.css">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>

  <main>

    
    <section class="hero">

      <div class="hero-content">

        <p class="tag">THE FUTURE OF MOTION</p>

        <h1>
          WELCOME
          <span> ITZFIZZ</span>
        </h1>

        <p class="description">
          Experience performance, design and technology
          moving together in perfect harmony.
        </p>

        <div class="stats">

          <div class="stat">
            <h2 class="number" data-value="98">0</h2>
            <p>Performance</p>
          </div>

          <div class="stat">
            <h2 class="number" data-value="87">0</h2>
            <p>Efficiency</p>
          </div>

          <div class="stat">
            <h2 class="number" data-value="95">0</h2>
            <p>Innovation</p>
          </div>

        </div>

      </div>
      <div class="car-wrapper">

        <div class="glow"></div>

        <div class="car">

          <div class="roof"></div>

          <div class="window front-window"></div>
          <div class="window back-window"></div>

          <div class="body"></div>

          <div class="wheel wheel-left"></div>
          <div class="wheel wheel-right"></div>

          <div class="light"></div>

        </div>

      </div>

      <div class="scroll-text">
        SCROLL TO EXPLORE ↓
      </div>

    </section>

    <section class="content-section">

      <p>ENGINEERED FOR MOTION</p>

      <h2>
        DESIGN THAT MOVES
      </h2>

      <p>
        Scroll back up and experience the hero animation again.
      </p>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
